server {
    listen 80;
    server_name localhost;
    client_max_body_size 0;
    
    root /usr/share/nginx/html;
    index index.html;

    # Fallback routing for SPA
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html so browser always gets the latest JS hashes
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets (JS/CSS) should be cached forever since they have hashes, 
    # but if they are missing, return 404 instead of index.html
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the Node.js backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
