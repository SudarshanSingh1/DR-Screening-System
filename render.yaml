services:
  # ─── FRONTEND ─────────────────────────────────────────────────────────────
  - type: web
    name: visionai-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: visionai-backend
          envVarKey: RENDER_EXTERNAL_URL

  # ─── BACKEND API ────────────────────────────────────────────────────────
  - type: web
    name: visionai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /health
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    disk:
      name: visionai-uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INFERENCE_SERVICE_URL
        fromService:
          type: web
          name: visionai-inference
          envVarKey: RENDER_INTERNAL_URL
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: visionai-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: visionai-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_BASE_PATH
        value: /app/uploads

  # ─── INFERENCE SERVICE ──────────────────────────────────────────────────
  - type: web
    name: visionai-inference
    env: docker
    dockerfilePath: ./inference_service/Dockerfile
    region: singapore
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: ACTIVE_PROVIDER
        value: python_v2
